<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Economy Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>💰 Economy Dashboard</h1>

  <div id="authBox">
    <a href="/auth/discord"><button>Login with Discord</button></a>
  </div>

  <div id="userBox" style="display:none;">
    <p id="userInfo"></p>
    <button onclick="logout()">Logout</button>

    <div class="card owner" id="adminBox" style="display:none;">
      <h2>👑 Owner Panel</h2>
      <input id="targetId" placeholder="Target User ID">
      <input id="amount" placeholder="Coins Amount">
      <button onclick="addCoins()">Add Coins</button>
      <p id="adminResult"></p>
    </div>

    <div class="card">
      <h2>⛏ Mine</h2>
      <button onclick="mine()">Mine</button>
      <p id="mineResult"></p>
    </div>

    <div class="card">
      <h2>🏆 Top</h2>
      <button onclick="loadTop()">Load Top</button>
      <div id="topList"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
