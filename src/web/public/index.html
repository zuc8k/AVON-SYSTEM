<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AvonBot Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <!-- ================= Sidebar ================= -->
  <aside class="sidebar">
    <h2 class="logo">🤖 AvonBot</h2>
    <nav>

      <!-- Overview -->
      <a onclick="showPage('overview')">👁️ Overview</a>

      <!-- Main Pages -->
      <a onclick="showPage('dashboard')">🏠 Dashboard</a>
      <a onclick="showPage('economy')">💰 Economy</a>
      <a onclick="showPage('top')">🏆 Top</a>

      <!-- Avon Panel (Admins only) -->
      <a id="ownerNav" style="display:none" onclick="showPage('owner')">
        👑 Avon Panel
      </a>

      <!-- Logout -->
      <a onclick="logout()">🚪 Logout</a>

    </nav>
  </aside>

  <!-- ================= Main ================= -->
  <main class="main">

    <!-- Top Bar -->
    <div class="topbar">
      <span id="userInfo">Loading...</span>
    </div>

    <!-- ================= Overview ================= -->
    <section id="overview" class="page">
      <h1>Overview</h1>

      <div class="cards">
        <div class="card">
          <h3>💰 Coins</h3>
          <p id="ovCoins">-</p>
        </div>

        <div class="card">
          <h3>⭐ Level</h3>
          <p id="ovLevel">-</p>
        </div>

        <div class="card">
          <h3>🏆 Rank</h3>
          <p id="ovRank">-</p>
        </div>
      </div>
    </section>

    <!-- ================= Dashboard ================= -->
    <section id="dashboard" class="page hidden">
      <h1>Dashboard</h1>

      <div class="cards">
        <div class="card">
          <h3>💰 Wallet</h3>
          <p id="wallet">-</p>
        </div>

        <div class="card">
          <h3>⛏ Miner</h3>
          <p id="miner">-</p>
        </div>

        <div class="card">
          <h3>🏠 Home</h3>
          <p id="home">-</p>
        </div>
      </div>
    </section>

    <!-- ================= Economy ================= -->
    <section id="economy" class="page hidden">
      <h1>Economy</h1>

      <button id="mineBtn" class="primary" onclick="mine()">
        ⛏ Start Mining
      </button>

      <p id="mineResult"></p>
      <p id="cooldownBox" class="cooldown"></p>
    </section>

    <!-- ================= Top ================= -->
    <section id="top" class="page hidden">
      <h1>Top Users</h1>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>User</th>
            <th>Coins</th>
          </tr>
        </thead>
        <tbody id="topTable"></tbody>
      </table>

      <div class="pagination">
        <button id="prevBtn" onclick="prevPage()">◀</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn" onclick="nextPage()">▶</button>
      </div>
    </section>

    <!-- ================= Avon Panel ================= -->
    <section id="owner" class="page hidden">
      <h1>Avon Panel</h1>

      <!-- ===== Admin Management ===== -->
      <h2>Admin Management</h2>
      <div class="owner-box">
        <input id="adminId" placeholder="Admin User ID">
        <button class="primary" onclick="addAdmin()">Add Admin</button>
        <button class="primary" onclick="removeAdmin()">Remove Admin</button>
      </div>

      <!-- ===== Economy Control ===== -->
      <h2>Economy Control</h2>
      <div class="owner-box">
        <input id="targetId" placeholder="User ID">
        <input id="amount" placeholder="Coins Amount">

        <button class="primary" onclick="addCoins()">Add Coins</button>
        <button class="primary" onclick="removeCoins()">Remove Coins</button>
        <button class="primary" onclick="resetWallet()">Reset Wallet</button>
        <button class="primary" onclick="toggleFreeze()">Freeze / Unfreeze</button>

        <p id="adminResult"></p>
      </div>

      <!-- ===== Economy Logs (Advanced) ===== -->
      <h2>Economy Logs</h2>

      <div class="logs-controls">
        <input
          id="logSearch"
          placeholder="Search by type or user ID"
          oninput="renderLogs()"
        >

        <select id="logFilter" onchange="renderLogs()">
          <option value="ALL">All</option>
          <option value="ADD">ADD</option>
          <option value="REMOVE">REMOVE</option>
          <option value="RESET">RESET</option>
          <option value="MINE">MINE</option>
          <option value="TRANSFER">TRANSFER</option>
          <option value="FREEZE">FREEZE</option>
          <option value="UNFREEZE">UNFREEZE</option>
        </select>
      </div>

      <div id="logsContainer" class="logs-box"></div>

      <div class="pagination">
        <button onclick="prevLogPage()">◀</button>
        <span id="logPageInfo">Page 1</span>
        <button onclick="nextLogPage()">▶</button>
      </div>
    </section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
