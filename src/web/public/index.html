<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Economy Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>💰 Economy Dashboard</h1>

    <!-- USER -->
    <div class="card">
      <h2>👤 Profile</h2>
      <input type="text" id="userId" placeholder="Discord User ID">
      <button onclick="loadProfile()">Load Profile</button>
      <pre id="profileBox">No data</pre>
    </div>

    <!-- MINE -->
    <div class="card">
      <h2>⛏ Mine</h2>
      <button onclick="mine()">Mine Coins</button>
      <p id="mineResult"></p>
    </div>

    <!-- TOP -->
    <div class="card">
      <h2>🏆 Top Users</h2>
      <button onclick="loadTop()">Load Top</button>
      <div id="topList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
